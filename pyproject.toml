[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airo-planner"
version = "0.0.10"
authors = [
  { name = "Andreas Verleysen", email = "andreas.verleysen@ugent.be" },
  { name = "Victor-Louis De Gusseme", email = "victorlouisdg@gmail.com" },
  { name = "Mathieu De Coster", email = "mathieu.decoster@ugent.be" }
]
description = "Motion planning for single and dual robot arms."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
    "airo-typing>=2025.11.0",
    "loguru>=0.7.3",
    "numpy",
]

[project.optional-dependencies]
# OMPL planners: SingleArmOmplPlanner, DualArmOmplPlanner, MobilePlatformOmplPlanner.
ompl = ["ompl>=2.0.0"]
# Drake collision checking and scene building (used in the notebooks and benchmark, not by the planners).
drake = ["airo-drake>=0.0.8"]
# cuRobo is not on PyPI: install it yourself, see the README.
# Extras needed by the example notebooks and the benchmark script.
examples = ["airo-planner[ompl,drake]", "airo-models", "yourdfpy>=0.0.58"]

[project.urls]
Homepage = "https://github.com/airo-ugent/airo-planner"
Issues = "https://github.com/airo-ugent/airo-planner/issues"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "setuptools>=80.9.0",
]

[tool.uv.sources]
airo-models = { git = "https://github.com/airo-ugent/airo-models", branch = "main" }
